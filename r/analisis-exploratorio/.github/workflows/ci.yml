name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs_on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Verificar archivo R
        run: |
          test -f Practica8.R && echo "Practica8.R presente" || echo "Falta Practica8.R"
          test -f CPS1985.csv && echo "CPS1985.csv presente" || echo "Falta CPS1985.csv"
          test -f README.md && echo "README.md presente" || echo "Falta README.md"
